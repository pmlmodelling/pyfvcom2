name: pyfvcom2
channels:
  - conda-forge
  - defaults

dependencies:
  # Python version (from requires-python >=3.8)
  - python>=3.8
  
  # Core runtime dependencies (from pyproject.toml dependencies)
  - numpy>=1.19.0
  - scipy>=1.5.0
  - matplotlib>=3.3.0
  - netcdf4>=1.5.0
  - xarray>=0.16.0
  
  # Development dependencies (from pyproject.toml optional-dependencies.dev)
  - pytest>=6.0
  - pytest-cov>=2.0
  - black>=21.0
  - flake8>=3.8
  - mypy>=0.800
  - pre-commit>=2.0
  
  # Documentation dependencies (from pyproject.toml optional-dependencies.docs)
  - sphinx>=3.0
  - sphinx_rtd_theme>=0.5
  
  # Additional useful packages for development
  - ipython
  - jupyter
  - notebook
  
  # Build dependencies
  - setuptools>=61.0
  - wheel
  - pip
  
  # Install the package itself in development mode
  - pip:
    - -e .
